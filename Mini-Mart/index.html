<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pixel Mini Mart - Tycoon Simulator</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Game Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- Virtual Touch Joystick (Mobile & Tablet) -->
  <div id="joystick-container" class="hidden">
    <div id="joystick-knob"></div>
  </div>

  <!-- Heads-Up Display (HUD) Layer -->
  <div id="ui-layer">
    
    <!-- Top Navigation & Stats Bar -->
    <header class="top-hud">
      
      <!-- Brand & Store Tier -->
      <div class="hud-card brand-card">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/>
            <path d="M3 6h18"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </div>
        <div class="brand-info">
          <span class="mart-title">PIXEL MINI MART</span>
          <span id="hud-level" class="mart-tier">MART TIER 1</span>
        </div>
      </div>

      <!-- Live Cash Wallet Counter -->
      <div class="hud-card money-card">
        <svg class="money-icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" x2="12" y1="2" y2="22"/>
          <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
        </svg>
        <span id="hud-money" class="money-val">$20</span>
      </div>

      <!-- Top Action Buttons -->
      <div class="top-actions">
        <!-- Upgrades Menu Button -->
        <button id="btn-upgrades" class="hud-btn" title="Store Upgrades (Hotkey E / Xbox X)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20"/><path d="m17 7-5-5-5 5"/>
          </svg>
          <span>Upgrades</span>
        </button>

        <!-- Music Toggle -->
        <button id="btn-music" class="hud-btn icon-only" title="Toggle Music">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
          </svg>
        </button>

        <!-- Sound SFX Toggle -->
        <button id="btn-sfx" class="hud-btn icon-only" title="Toggle Sound FX">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          </svg>
        </button>

        <!-- Pause Button -->
        <button id="btn-pause" class="hud-btn icon-only" title="Pause Game (Hotkey P / Xbox Start)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>
      </div>

    </header>

    <!-- Bottom HUD Bar -->
    <footer class="bottom-hud">
      <!-- Player Backpack Stack Counter -->
      <div class="hud-card stack-card">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
        </svg>
        <span class="stack-label">Stack:</span>
        <span id="hud-stack" class="stack-val">0/6</span>
      </div>

      <!-- Turbo Sprint Button (Touch / Mouse) -->
      <button id="btn-turbo" class="turbo-button" title="Turbo Sprint (Spacebar / Xbox Button A)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span class="turbo-text">TURBO</span>
      </button>
    </footer>

  </div>

  <!-- Store Upgrades Modal Dialog -->
  <div id="upgrade-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">STORE UPGRADES</h2>
        <button id="btn-close-upgrades" class="hud-btn icon-only" title="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="modal-body">
        <!-- Player Speed Upgrade -->
        <div class="upgrade-item">
          <div class="upgrade-details">
            <div class="upgrade-name">Player Speed</div>
            <div id="lbl-speed-lvl" class="upgrade-sub">Lv. 1/5</div>
          </div>
          <button id="btn-buy-speed" class="upgrade-btn">
            <span>UPGRADE</span>
            <span id="lbl-speed-cost">$50</span>
          </button>
        </div>

        <!-- Carry Capacity Upgrade -->
        <div class="upgrade-item">
          <div class="upgrade-details">
            <div class="upgrade-name">Backpack Capacity</div>
            <div id="lbl-stack-lvl" class="upgrade-sub">Lv. 1/5 (6 Items)</div>
          </div>
          <button id="btn-buy-stack" class="upgrade-btn">
            <span>UPGRADE</span>
            <span id="lbl-stack-cost">$60</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pause Modal Dialog -->
  <div id="pause-modal" class="modal-overlay hidden">
    <div class="modal-card" style="text-align: center;">
      <h2 class="modal-title">MART PAUSED</h2>
      <p style="color: #94a3b8; font-size: 0.95rem;">Walk near garden plots to harvest, near shelves to restock, and over the register to collect revenue!</p>
      
      <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
        <button id="btn-resume" class="action-btn-main">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <span>RESUME GAME</span>
        </button>
        
        <a href="../index.html" class="hud-btn" style="justify-content: center; text-decoration: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          </svg>
          <span>Return to Game Hub</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="audio.js"></script>
  <script src="entities.js"></script>
  <script src="game.js"></script>
</body>
</html>
